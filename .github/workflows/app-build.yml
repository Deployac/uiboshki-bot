name: Сборка приложения

# Установочные файлы приложения (app/): APK для Android и IPA без подписи
# для iPhone. Скачать — вкладка Actions → запуск → Artifacts. Номер сборки =
# номер запуска, поэтому новый APK ставится поверх старого (если подпись
# та же: секреты ANDROID_KEYSTORE — keystore в base64, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD; без них — отладочный ключ раннера, тогда перед
# обновлением старую версию придётся удалить).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-build.yml"]
  pull_request:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-build.yml"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Ключ подписи
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Нет секрета ANDROID_KEYSTORE — APK подписан отладочным ключом"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$PASS" "$ALIAS" "$PASS" > android/key.properties

      - name: Сборка APK
        run: |
          flutter pub get
          flutter build apk --release --build-number=${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-release.apk kapibara-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kapibara-android-${{ github.run_number }}
          path: app/kapibara-${{ github.run_number }}.apk
          retention-days: 30

  # Без аккаунта разработчика Apple подписать нечем: IPA ставится через
  # Sideloadly/AltStore со своим Apple ID (на 7 дней). Заодно проверка, что
  # приложение собирается под iOS.
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Сборка IPA без подписи
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr kapibara-${{ github.run_number }}.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: kapibara-ios-${{ github.run_number }}
          path: app/kapibara-${{ github.run_number }}.ipa
          retention-days: 30
